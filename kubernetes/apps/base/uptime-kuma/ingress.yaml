---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelab-ingress
  namespace: default
  annotations:
    # Enable cert-manager to create certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Optional: Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: traefik-proxy
  tls:
    - hosts:
        - happybit.qzz.io
      secretName: homelab-tls  # cert-manager will create this secret
  rules:
  - host: happybit.qzz.io  
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simple-app
            port:
              number: 80