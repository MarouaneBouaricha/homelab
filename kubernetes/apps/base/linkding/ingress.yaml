---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelab-ingress
  namespace: default
  annotations:
    # Enable cert-manager to create certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Optional: Force HTTPS redirect
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-dummy-chain@kubernetescrd, default-linkding-chain@kubernetescrd
spec:
  ingressClassName: traefik-proxy
  tls:
    - hosts:
        - happybit.qzz.io
      secretName: homelab-tls  # cert-manager will create this secret
  rules:
  - host: happybit.qzz.io  
    http:
      paths:
      - path: /linkding
        pathType: Prefix
        backend:
          service:
            name: linkding-service
            port:
              number: 9090
      - path: /dummy
        pathType: Prefix
        backend:
          service:
            name: simple-app
            port:
              number: 80
      
